sentence=Encoder for Betaflight's blackbox log format (.bbl), readable by Blackbox Explorer and blackbox_decode
paragraph=Table-driven: the caller describes its fields (name, sign, I/P predictor and encoding) and the encoder writes the header and I, P, S and E frames into a caller buffer, ready to push into a log ring. Storage-agnostic. Static allocation. Derived from Betaflight's blackbox encoder; GPL-3.0-or-later. Interface provisional.
