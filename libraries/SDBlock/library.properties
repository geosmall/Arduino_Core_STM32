name=SDBlock
version=0.1.0
author=Arduino STM32
maintainer=Arduino STM32
sentence=SD card block device with bounded, poll-driven write steps (polled SPI back end)
paragraph=SDHC/SDXC in SPI mode. A multi-block write stream (ACMD23 + CMD25) advanced one bounded step at a time: a one-byte busy check, then at most one piece of the block. Waiting block reads and writes for use while disarmed. The back end owns its block buffer. Static allocation, no DMA. F4, F7 and G4 SPI blocks. Interface provisional.
category=Data Storage
