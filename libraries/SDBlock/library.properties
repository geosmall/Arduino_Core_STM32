sentence=SD card block device with bounded, poll-driven write steps (SPI and SDMMC back ends)
paragraph=SDHC/SDXC cards behind one interface (SDBlockDevice): a write stream advanced one bounded step at a time, and waiting block reads and writes for use while disarmed. SDBlockSPI: polled SPI without DMA, one open CMD25 stream sent in 48 B pieces (F4, F7, G4). SDBlockSDMMC: SDMMC1 4-bit with its own DMA, sent in chunks of up to 16 blocks (H7). The back end owns its buffer. Static allocation. Interface provisional.
