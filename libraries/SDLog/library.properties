name=SDLog
version=0.1.0
author=Arduino STM32
maintainer=Arduino STM32
sentence=SD card log writer: plain FAT log files written in flight as bounded raw block streams
paragraph=Each log is one contiguous FAT file reserved ahead while disarmed; in flight a RAM ring is drained one bounded step per call into an SDBlock stream, with the directory entry's size kept current by segment. FatFs (SDFS) runs only while disarmed. List, dump and erase for a USB CLI. Static allocation. Interface provisional.
